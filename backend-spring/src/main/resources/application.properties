spring.application.name=backend-spring

# SQL Server Database Configuration
spring.datasource.url=jdbc:sqlserver://${DB_SERVER:127.0.0.1}:1433;databaseName=${DB_DATABASE:TiMiFoodDB};encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate Configuration
# Cực kỳ quan trọng: Để 'none' hoặc 'validate' để KHÔNG làm thay đổi cấu trúc bảng cũ của Node.js
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
# Cập nhật Physical Naming Strategy để ngăn Hibernate đổi tên cột thành snake_case (spring boot 3)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
spring.jpa.properties.hibernate.physical_naming_strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Server Port (Chạy ở port 8080 để không đụng với Node.js port 3500)
server.port=8080

# PayOS Configuration (Thay bằng mã thực tế trên trang quản trị PayOS)
payos.client-id=${PAYOS_CLIENT_ID:your_client_id}
payos.api-key=${PAYOS_API_KEY:your_api_key}
payos.checksum-key=${PAYOS_CHECKSUM_KEY:your_checksum_key}
