        <div class="container" id="account-user">
            <div class="main-account">
                <div class="main-account-header">
                    <h3>Thông tin tài khoản của bạn</h3>
                    <p>Quản lý thông tin để bảo mật tài khoản</p>
                </div>
                <div class="main-account-body">
                    <div class="main-account-body-col">
                        <form action="" class="info-user">
                            <div class="form-group">
                                <label for="infoname" class="form-label">Họ và tên</label>
                                <input class="form-control" type="text" name="infoname" id="infoname" placeholder="">
                            </div>
                            <div class="form-group">
                                <label for="infophone" class="form-label">Số điện thoại</label>
                                <input class="form-control" type="text" name="infophone" id="infophone" disabled="true"
                                    placeholder="">
                            </div>
                            <div class="form-group">
                                <label for="infoemail" class="form-label">Email</label>
                                <input class="form-control" type="email" name="infoemail" id="infoemail"
                                    placeholder="Thêm địa chỉ email của bạn">
                                <span class="inforemail-error form-message"></span>
                            </div>
                            <div class="form-group">
                                <label for="infoaddress" class="form-label">Địa chỉ</label>
                                <div style="position: relative; display: flex; align-items: center;">
                                    <input class="form-control" type="text" name="infoaddress" id="infoaddress"
                                        placeholder="Thêm địa chỉ giao hàng của bạn" style="width: 100%; padding-right: 40px;">
                                    <button type="button" class="btn-location-picker" id="btn-location-picker" title="Chọn vị trí trên bản đồ" onclick="openLocationPicker('infoaddress')" style="position: absolute; right: 5px; background: none; border: none; padding: 5px; color: #ef4444; cursor: pointer; font-size: 1.2rem; display: flex; align-items: center; justify-content: center;"><i class="fa-light fa-map-location-dot"></i></button>
                                </div>
                            </div>
                        </form>
                    </div>
                    <div class="main-account-body-col">
                        <form action="" class="change-password">
                            <div class="form-group">
                                <label for="password-cur-info" class="form-label w60">Mật khẩu hiện tại</label>
                                <input class="form-control" type="password" name="current-password" id="password-cur-info"
                                    autocomplete="current-password" placeholder="Nhập mật khẩu hiện tại">
                                <span class="password-cur-info-error form-message"></span>
                            </div>
                            <div class="form-group">
                                <label for="password-after-info" class="form-label w60">Mật khẩu mới </label>
                                <input class="form-control" type="password" name="new-password" id="password-after-info"
                                    autocomplete="new-password" placeholder="Nhập mật khẩu mới">
                                <small class="form-text text-muted" style="font-size: 0.8rem; color: #666;">Tối thiểu 8 ký tự, gồm chữ hoa, chữ thường và số</small>
                                <span class="password-after-info-error form-message"></span>
                            </div>
                            <div class="form-group">
                                <label for="password-comfirm-info" class="form-label w60">Xác nhận mật khẩu mới</label>
                                <input class="form-control" type="password" name="confirm-password" id="password-comfirm-info"
                                    autocomplete="new-password" placeholder="Nhập lại mật khẩu mới">
                                <span class="password-after-comfirm-error form-message"></span>
                            </div>
                        </form>
                    </div>
                    <div class="main-account-body-row">
                        <div>
                            <button id="save-info-user" onclick="changeInformation()"><i
                                    class="fa-regular fa-floppy-disk"></i> Lưu thay đổi</button>
                        </div>
                        <div>
                            <button id="save-password" onclick="changePassword()"><i class="fa-regular fa-key"></i> Đổi
                                mật khẩu</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
