<div class="container hide" id="loyalty-page">
    <div class="main-account">
        <div class="main-account-header">
            <h3>Khách hàng thân thiết</h3>
            <p>Quản lý điểm thưởng và ưu đãi của bạn</p>
        </div>
        
        <div class="loyalty-points-card tier-bronze" style="margin-bottom: 25px; border-radius: 12px; padding: 20px; display: flex; justify-content: space-between; align-items: center; color: #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
            <div class="loyalty-info">
                <h4 style="margin: 0; font-size: 1.2rem; display: flex; align-items: center; gap: 8px;"><i class="fa-solid fa-crown" style="color: #FFD700;"></i> <span id="loyalty-page-tier-name">Hạng Đồng</span></h4>
                <p style="margin: 5px 0 0 0; font-size: 0.9rem; opacity: 0.9;">Tích lũy để thăng hạng và nhận nhiều ưu đãi</p>
            </div>
            <div class="loyalty-points" style="text-align: right;">
                <span style="font-size: 2rem; font-weight: bold; display: block;" id="loyalty-page-points-value">0</span>
                <span style="font-size: 0.9rem; font-weight: 500;">TiMi Points</span>
            </div>
        </div>

        <div class="main-account-body" style="display: block; background: transparent; padding: 0; box-shadow: none;">
            <h4 style="margin-bottom: 20px; color: #333; font-weight: 600;"><i class="fa-regular fa-gift" style="color: #ef4444; margin-right: 8px;"></i> Đổi ưu đãi đặc biệt</h4>
            
            <div class="voucher-list" id="reward-packages-container" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px;">
                <!-- Reward packages will be rendered here dynamically -->
                <div style="text-align: center; width: 100%; grid-column: 1/-1; padding: 20px;">
                    <i class="fa-solid fa-spinner fa-spin" style="font-size: 24px; color: #ef4444;"></i> Đang tải gói ưu đãi...
                </div>
            </div>
            
            <div style="margin-top: 30px; padding: 20px; background: #f8fafc; border-radius: 8px; border-left: 4px solid #3b82f6;">
                <h5 style="margin: 0 0 10px 0; color: #1e293b; font-size: 1rem;"><i class="fa-solid fa-clock-rotate-left"></i> Lịch sử đổi ưu đãi</h5>
                <div id="loyalty-history-list" style="color: #64748b; font-size: 0.9rem; line-height: 1.6;">
                    Chưa có lịch sử đổi ưu đãi nào.
                </div>
            </div>
        </div>
    </div>
</div>
